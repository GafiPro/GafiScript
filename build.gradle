plugins {
    id "net.fabricmc.fabric-loom-remap" version "1.17.13"
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = uri("https://maven.fabricmc.net/") }
}

dependencies {
    minecraft("com.mojang:minecraft:" + project.minecraft_version)
    mappings("net.fabricmc:yarn:" + project.yarn_mappings + ":v2")
    modImplementation("net.fabricmc:fabric-loader:" + project.loader_version)
    modImplementation("net.fabricmc.fabric-api:fabric-api:" + project.fabric_version)
    modImplementation("net.fabricmc.fabric-api:fabric-events-interaction-v0:" + project.fabric_version)

    implementation("org.eclipse.jdt:ecj:3.43.0")
    include("org.eclipse.jdt:ecj:3.43.0")

    implementation("com.github.javaparser:javaparser-core:3.28.2")
    include("com.github.javaparser:javaparser-core:3.28.2")

    testImplementation("org.junit.jupiter:junit-jupiter:5.14.4")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.14.4")
}

processResources {
    inputs.property("version", project.version)
    filesMatching("fabric.mod.json") {
        expand(version: project.version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.test {
    useJUnitPlatform()
}

jar {
    from("LICENSE") {
        rename { "LICENSE_GafiScript" }
    }
}

tasks.named("remapJar") {
    dependsOn(tasks.named("jar"))
}


tasks.withType(Javadoc).configureEach {
    options.encoding = "UTF-8"
    options.addStringOption("Xdoclint:none", "-quiet")
    failOnError = false
}

tasks.register("apiDocs") {
    dependsOn(tasks.named("javadoc"))
    group = "documentation"
    description = "Generate GafiScript API Javadocs."
}
